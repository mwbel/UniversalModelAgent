<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地心天球 (3D交互版)</title>
    <!-- Load Plotly.js -->
    <script src="assets/lib/plotly.min.js"></script>
    <!-- Load Astronomy Engine -->
    <script src="assets/lib/astronomy.min.js"></script>
    <script>
        // Global Error Handler
        window.onerror = function(msg, url, line, col, error) {
            const loadingEl = document.getElementById('loading');
            if (loadingEl) {
                loadingEl.innerHTML = `⚠️ 初始化失败: ${msg}<br><small>Line: ${line}</small>`;
                loadingEl.style.color = '#ff6b6b';
            }
            console.error('Global Error:', msg, error);
            return false;
        };
    </script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #e0e0e0;
            --panel-bg: #1a1a1a;
            --accent-color: #3b82f6;
            --border-color: #333;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }
        /* Sidebar */
        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 10;
        }
        .sidebar h2 {
            margin: 0 0 20px 0;
            font-size: 1.2rem;
            color: #fff;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row > div {
            flex: 1;
        }
        input[type="number"], input[type="text"], input[type="time"], select {
            width: 100%;
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .location-search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .location-search-row input {
            flex: 1;
        }
        .location-search-row button {
            width: auto;
            min-width: 64px;
            margin-top: 0;
            padding: 8px 10px;
        }
        .location-status {
            min-height: 18px;
            margin-top: 8px;
            font-size: 0.78rem;
            line-height: 1.4;
            color: #9fb7d7;
        }
        .date-select-row {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr 0.9fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        button {
            width: 100%;
            background: #333;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background: #444;
        }
        button.primary {
            background: var(--accent-color);
        }
        button.primary:hover {
            background: #2563eb;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .checkbox-label input {
            cursor: pointer;
        }
        .info-panel {
            background: #252525;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #ccc;
            margin-top: auto;
        }
        .info-panel h4 {
            margin: 0 0 8px 0;
            color: white;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        
        /* Main Area */
        .main-content {
            flex: 1;
            position: relative;
        }
        #plot-container {
            width: 100%;
            height: 100%;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #666;
            pointer-events: none;
        }
        body.embed-mode .back-link {
            display: none;
        }
        body.embed-mode .sidebar {
            width: 270px;
            padding: 16px;
        }
        body.embed-mode .sidebar h2 {
            font-size: 1rem;
            margin-bottom: 14px;
        }
        body.embed-mode .control-group {
            margin-bottom: 14px;
        }
        @media (max-width: 760px) {
            body {
                display: block;
                overflow: auto;
            }
            .sidebar {
                width: auto;
                border-right: 0;
                border-bottom: 1px solid var(--border-color);
            }
            .main-content {
                height: 620px;
            }
            body.embed-mode {
                display: flex;
                overflow: hidden;
            }
            body.embed-mode .sidebar {
                display: none;
            }
            body.embed-mode .main-content {
                width: 100vw;
                height: 100vh;
            }
        }

</head>

    <div class="info-panel">

        • 蓝绿色实体: 地球球面贴图<br>

        • 基于 Astronomy Engine 算法<br>

    const pageParams = new URLSearchParams(window.location.search);

    function getParamNumber(name, fallback) {
        const value = parseFloat(pageParams.get(name) || '');
        return Number.isFinite(value) ? value : fallback;
    }

    function setSignedCoordinate(value, valueInputId, hemisphereInputId) {
        const valueInput = document.getElementById(valueInputId);
        const hemisphereInput = document.getElementById(hemisphereInputId);
        if (!valueInput || !hemisphereInput || !Number.isFinite(value)) return;
        valueInput.value = Math.abs(value).toFixed(2);
        hemisphereInput.value = value >= 0 ? '1' : '-1';
    }

    function getParamBoolean(name, fallback) {
        const value = pageParams.get(name);
        if (value === null) return fallback;
        return ['1', 'true', 'yes', 'on'].includes(value.toLowerCase());
    }

    function pad2(value) {
        return String(value).padStart(2, '0');
    }

    function daysInMonth(year, month) {
        return new Date(year, month, 0).getDate();
    }

    function selectedDateString() {
        const year = document.getElementById('yearSelect').value;
        const month = document.getElementById('monthSelect').value;
        const day = document.getElementById('daySelect').value;
        if (!year || !month || !day) return '';
        return `${year}-${pad2(month)}-${pad2(day)}`;
    }

    function populateDateControls(date) {
        const yearSelect = document.getElementById('yearSelect');
        const monthSelect = document.getElementById('monthSelect');
        const daySelect = document.getElementById('daySelect');
        if (!yearSelect || !monthSelect || !daySelect) return;

        yearSelect.innerHTML = '';
        const currentYear = new Date().getFullYear();
        for (let year = currentYear - 100; year <= currentYear + 100; year++) {
            const opt = document.createElement('option');
            opt.value = String(year);
            opt.textContent = `${year}年`;
            yearSelect.appendChild(opt);
        }

        monthSelect.innerHTML = '';
        for (let month = 1; month <= 12; month++) {
            const opt = document.createElement('option');
            opt.value = String(month);
            opt.textContent = `${month}月`;
            monthSelect.appendChild(opt);
        }

        setDateControlsFromDate(date);
    }

    function refreshDayOptions(preferredDay) {
        const year = parseInt(document.getElementById('yearSelect').value, 10);
        const month = parseInt(document.getElementById('monthSelect').value, 10);
        const daySelect = document.getElementById('daySelect');
        const oldDay = preferredDay || parseInt(daySelect.value, 10) || 1;
        const maxDay = daysInMonth(year, month);
        daySelect.innerHTML = '';
        for (let day = 1; day <= maxDay; day++) {
            const opt = document.createElement('option');
            opt.value = String(day);
            opt.textContent = `${day}日`;
            daySelect.appendChild(opt);
        }
        daySelect.value = String(Math.min(oldDay, maxDay));
    }

    function setDateControlsFromDate(date) {
        const yearSelect = document.getElementById('yearSelect');
        const monthSelect = document.getElementById('monthSelect');
        const daySelect = document.getElementById('daySelect');
        if (!yearSelect || !monthSelect || !daySelect) return;
        yearSelect.value = String(date.getFullYear());
        monthSelect.value = String(date.getMonth() + 1);
        refreshDayOptions(date.getDate());
    }

    function flattenLocations() {
        const items = [];
        Object.entries(LOCATIONS).forEach(([country, cities]) => {
            Object.entries(cities).forEach(([city, loc]) => {
                items.push({ country, city, label: `${country} / ${city}`, ...loc });
            });
        });
        return items;
    }

        const status = document.getElementById('locationStatus');
        if (!status) return;
        status.textContent = message;
        status.style.color = isError ? '#ff9b9b' : '#9fb7d7';

        document.getElementById('latHemisphere').value = lat >= 0 ? '1' : '-1';
        document.getElementById('lonHemisphere').value = lon >= 0 ? '1' : '-1';
        document.getElementById('lat').value = Math.abs(lat).toFixed(2);
        document.getElementById('lon').value = Math.abs(lon).toFixed(2);

        if (!location || !Number.isFinite(location.lat) || !Number.isFinite(location.lon)) return;
        setCoordinateValues(location.lat, location.lon);
        setLocationStatus(`${sourceLabel}: ${location.country || ''}${location.country ? ' / ' : ''}${location.city || location.name || ''} (${Math.abs(location.lat).toFixed(2)}°${location.lat >= 0 ? 'N' : 'S'}, ${Math.abs(location.lon).toFixed(2)}°${location.lon >= 0 ? 'E' : 'W'})`);
        updatePlot();
    }

    function normalizeSearchText(value) {
        return String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function findLocalLocation(query) {
        const normalized = normalizeSearchText(query);
        if (!normalized) return null;
        return LOCATION_INDEX.find(item =>
            normalizeSearchText(item.label) === normalized ||
            normalizeSearchText(item.city) === normalized
        ) || LOCATION_INDEX.find(item =>
            normalizeSearchText(item.label).includes(normalized) ||
            normalizeSearchText(item.city).includes(normalized) ||
            normalizeSearchText(`${item.city} ${item.country}`).includes(normalized)
        ) || null;
    }

    async function searchOnlineLocation(query) {
        const endpoint = new URL('https://geocoding-api.open-meteo.com/v1/search');
        endpoint.searchParams.set('name', query);
        endpoint.searchParams.set('count', '1');
        endpoint.searchParams.set('language', 'zh');
        endpoint.searchParams.set('format', 'json');

        const response = await fetch(endpoint.toString());
        if (!response.ok) {
            throw new Error(`地理编码服务返回 ${response.status}`);
        }
        const payload = await response.json();
        const result = payload.results && payload.results[0];
        if (!result) return null;
        return {
            country: result.country || result.country_code || '',
            city: result.name || query,
            lat: Number(result.latitude),
            lon: Number(result.longitude)
        };
    }

    async function locateSearchPlace() {
        const input = document.getElementById('placeSearch');
        const query = input ? input.value.trim() : '';
        if (!query) {
            setLocationStatus('请输入国家或城市名称。', true);
            return;
        }

        const local = findLocalLocation(query);
        if (local) {
            applyLocation(local, '内置城市库');
            return;
        }

        setLocationStatus(`正在在线定位: ${query} ...`);
        try {
            const remote = await searchOnlineLocation(query);
            if (!remote || !Number.isFinite(remote.lat) || !Number.isFinite(remote.lon)) {
                setLocationStatus(`没有找到 ${query}。可直接手动输入经纬度。`, true);
                return;
            }
            applyLocation(remote, '在线地理编码');
        } catch (error) {
            setLocationStatus(`在线定位失败: ${error.message || error}。可直接手动输入经纬度。`, true);
        }
    }

    // Helper: Spherical (Az/Alt) to Cartesian (x,y,z)
    // Az: 0=North, 90=East. Alt: 0=Horizon, 90=Zenith.
    // Python Logic: x=East, y=North, z=Up.
    // X = r * cos(alt) * sin(az)
    // Y = r * cos(alt) * cos(az)
    // Z = r * sin(alt)
    function sph2cart(az, alt, r = 1.0) {
        const azRad = az * Math.PI / 180;
        const altRad = alt * Math.PI / 180;
        return {
            x: r * Math.cos(altRad) * Math.sin(azRad),
            y: r * Math.cos(altRad) * Math.cos(azRad),
            z: r * Math.sin(altRad)
        };
    }

    function degToRad(deg) {
        return deg * Math.PI / 180;
    }

    function addVec(a, b) {
        return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z };
    }

    function scaleVec(v, scale) {
        return { x: v.x * scale, y: v.y * scale, z: v.z * scale };
    }

    function dotVec(a, b) {
        return a.x * b.x + a.y * b.y + a.z * b.z;
    }

    function normalizeVec(v) {
        const len = Math.sqrt(dotVec(v, v)) || 1;
        return scaleVec(v, 1 / len);
    }

    function observerFrame(lat, lon) {
        const latRad = degToRad(lat);
        const lonRad = degToRad(lon);
        const up = normalizeVec({
            x: Math.cos(latRad) * Math.cos(lonRad),
            y: Math.cos(latRad) * Math.sin(lonRad),
            z: Math.sin(latRad)
        });
        const east = normalizeVec({
            x: -Math.sin(lonRad),
            y: Math.cos(lonRad),
            z: 0
        });
        const north = normalizeVec({
            x: -Math.sin(latRad) * Math.cos(lonRad),
            y: -Math.sin(latRad) * Math.sin(lonRad),
            z: Math.cos(latRad)
        });

        return {
            up,
            east,
            north,
            observer: scaleVec(up, CONFIG.earthRadius)
        };
    }

    function localToWorld(local, frame) {
        return normalizeVec(addVec(
            addVec(scaleVec(frame.east, local.x), scaleVec(frame.north, local.y)),
            scaleVec(frame.up, local.z)
        ));
    }

    function projectToSphere(point, radius = CONFIG.sphereRadius) {
        return scaleVec(normalizeVec(point), radius);
    }

    function skyPointFromHorizontal(az, alt, frame, radius = CONFIG.sphereRadius) {
        const local = sph2cart(az, alt, 1);
        const dir = localToWorld(local, frame);
        const origin = frame.observer;
        const b = 2 * dotVec(origin, dir);
        const c = dotVec(origin, origin) - radius * radius;
        const discriminant = Math.max(0, b * b - 4 * c);
        const distance = (-b + Math.sqrt(discriminant)) / 2;
        return addVec(origin, scaleVec(dir, distance));
    }

    function earthSurfaceValue(lon, lat) {
        const lonDistance = (a, b) => {
            let d = Math.abs(a - b) % 360;
            return d > 180 ? 360 - d : d;
        };
        const blob = (centerLon, centerLat, lonWidth, latWidth, weight) => {
            const dx = lonDistance(lon, centerLon) / lonWidth;
            const dy = (lat - centerLat) / latWidth;
            return weight * Math.exp(-(dx * dx + dy * dy));
        };

        let land =
            blob(-100, 46, 28, 18, 1.1) + blob(-62, -14, 22, 34, 1.0) +
            blob(20, 5, 34, 34, 1.2) + blob(78, 45, 56, 22, 1.35) +
            blob(105, 18, 32, 18, 1.0) + blob(135, -25, 18, 13, 1.0) +
            blob(-42, 72, 14, 9, 0.8) + blob(45, -22, 10, 13, 0.65);

        land += 0.14 * Math.sin(degToRad(lon * 3 + lat * 2));

        if (lat < -70 || lat > 76) return 3.85;
        if (land > 0.46) return 2.1 + Math.min(0.85, land * 0.38);
        if (land > 0.34) return 1.35;
        return 0.16 + 0.28 * Math.max(0, Math.cos(degToRad(lat)));
    }

    function makeGeoPoint(lat, lon, radius) {
        const latRad = degToRad(lat);
        const lonRad = degToRad(lon);
        return {
            x: radius * Math.cos(latRad) * Math.cos(lonRad),
            y: radius * Math.cos(latRad) * Math.sin(lonRad),
            z: radius * Math.sin(latRad)
        };
    }

    function buildEarthTraces(frame, lat, lon) {
        const x = [], y = [], z = [], surfacecolor = [];
        for (let earthLat = -90; earthLat <= 90; earthLat += 5) {
            const rowX = [], rowY = [], rowZ = [], colorRow = [];
            for (let earthLon = -180; earthLon <= 180; earthLon += 5) {
                const p = makeGeoPoint(earthLat, earthLon, CONFIG.earthRadius);
                rowX.push(p.x); rowY.push(p.y); rowZ.push(p.z);
                colorRow.push(earthSurfaceValue(earthLon, earthLat));
            }
            x.push(rowX); y.push(rowY); z.push(rowZ); surfacecolor.push(colorRow);
        }

        const traces = [{
            type: 'surface',
            x, y, z, surfacecolor,
            cmin: 0,
            cmax: 4,
            colorscale: [
                [0.00, '#064f8f'],
                [0.18, '#0c83b8'],
                [0.34, '#21b7c8'],
                [0.40, '#75c66b'],
                [0.58, '#5d9f54'],
                [0.74, '#b6aa72'],
                [0.88, '#d6d9c7'],
                [1.00, '#f5f7fb']
            ],
            showscale: false,
            opacity: 0.98,
            hoverinfo: 'none',
            name: '地球贴图',
            lighting: { ambient: 0.55, diffuse: 0.8, roughness: 0.95, specular: 0.08 }
        }];

        for (let earthLat = -60; earthLat <= 60; earthLat += 30) {
            const lineX = [], lineY = [], lineZ = [];
            for (let earthLon = -180; earthLon <= 180; earthLon += 4) {
                const p = makeGeoPoint(earthLat, earthLon, CONFIG.earthRadius * 1.01);
                lineX.push(p.x); lineY.push(p.y); lineZ.push(p.z);
            }
            traces.push({
                type: 'scatter3d', mode: 'lines',
                x: lineX, y: lineY, z: lineZ,
                line: { color: 'rgba(255,255,255,0.38)', width: 1 },
                showlegend: false, hoverinfo: 'none'
            });
        }

        for (let earthLon = -180; earthLon < 180; earthLon += 30) {
            const lineX = [], lineY = [], lineZ = [];
            for (let earthLat = -90; earthLat <= 90; earthLat += 4) {
                const p = makeGeoPoint(earthLat, earthLon, CONFIG.earthRadius * 1.01);
                lineX.push(p.x); lineY.push(p.y); lineZ.push(p.z);
            }
            traces.push({
                type: 'scatter3d', mode: 'lines',
                x: lineX, y: lineY, z: lineZ,
                line: { color: 'rgba(255,255,255,0.32)', width: 1 },
                showlegend: false, hoverinfo: 'none'
            });
        }

        const zenith = skyPointFromHorizontal(0, 90, frame);
        traces.push({
            type: 'scatter3d', mode: 'markers+text',
            x: [frame.observer.x],
            y: [frame.observer.y],
            z: [frame.observer.z],
            marker: { size: 8, color: '#ffffff', line: { color: '#0b1220', width: 2 } },
            text: ['观测点'],
            textposition: 'top center',
            textfont: { color: '#ffffff', size: 12 },
            name: '地表观测点',
            hoverinfo: 'text',
            hovertext: `观测点<br>${Math.abs(lat).toFixed(2)}°${lat>=0?'N':'S'}, ${Math.abs(lon).toFixed(2)}°${lon>=0?'E':'W'}`
        });

        traces.push({
            type: 'scatter3d', mode: 'lines',
            x: [frame.observer.x, zenith.x],
            y: [frame.observer.y, zenith.y],
            z: [frame.observer.z, zenith.z],
            line: { color: 'rgba(255,255,255,0.65)', width: 2, dash: 'dot' },
            name: '当地天顶方向',
            hoverinfo: 'none'
        });

        return traces;
    }

    // Initialize UI
    function initUI() {
        const now = new Date();
        const requestedDate = pageParams.get('date');
        const initialDate = requestedDate ? new Date(`${requestedDate}T00:00:00`) : now;
        populateDateControls(isNaN(initialDate.getTime()) ? now : initialDate);
        document.getElementById('time').value = pageParams.get('time') || now.toTimeString().split(' ')[0];
        setSignedCoordinate(getParamNumber('lat', 31.23), 'lat', 'latHemisphere');
        setSignedCoordinate(getParamNumber('lon', 121.47), 'lon', 'lonHemisphere');
        const altitudeParam = getParamNumber('altitude', NaN);
        if (Number.isFinite(altitudeParam)) {
            document.getElementById('altitude').value = String(altitudeParam);
        }
        document.getElementById('showTrails').checked = getParamBoolean('showTrails', true);
        document.getElementById('showGrid').checked = getParamBoolean('showHorizonGrid', true);
        document.getElementById('showEquatorial').checked = getParamBoolean('showEquatorialGrid', true);
        
        // Populate Country Dropdown
        const countrySelect = document.getElementById('countrySelect');
        const citySelect = document.getElementById('citySelect');
        const suggestions = document.getElementById('placeSuggestions');
        
        Object.keys(LOCATIONS).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN')).forEach(country => {
            const opt = document.createElement('option');
            opt.value = country;
            opt.textContent = country;
            countrySelect.appendChild(opt);
        });

        if (suggestions) {
            LOCATION_INDEX.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.label;
                suggestions.appendChild(opt);
            });
        }
        
        // Country Change Handler
        countrySelect.addEventListener('change', () => {
            citySelect.innerHTML = '<option value="">-- 城市 --</option>';
            const country = countrySelect.value;
            if (country && LOCATIONS[country]) {
                Object.keys(LOCATIONS[country]).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN')).forEach(city => {
                    const opt = document.createElement('option');
                    opt.value = city;
                    opt.textContent = city;
                    citySelect.appendChild(opt);
                });
                setLocationStatus(`已选择国家: ${country}。请选择城市，或用搜索框定位其他城市。`);
            }
        });
        
        // City Change Handler
        citySelect.addEventListener('change', () => {
            const country = countrySelect.value;
            const city = citySelect.value;
            if (country && city && LOCATIONS[country][city]) {
                applyLocation({ country, city, ...LOCATIONS[country][city] });
            }
        });

        document.getElementById('btn-search-place').addEventListener('click', locateSearchPlace);
        document.getElementById('placeSearch').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                locateSearchPlace();
            }
        });

        ['yearSelect', 'monthSelect'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('change', () => {
                refreshDayOptions();
                updatePlot();
            });
        });

        ['lat', 'lon', 'latHemisphere', 'lonHemisphere', 'altitude', 'daySelect', 'time', 'showTrails', 'showGrid', 'showEquatorial'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('change', updatePlot);
                if (el.tagName === 'INPUT') {
                     el.addEventListener('input', () => {
                        if(id === 'lat' || id === 'lon' || id === 'altitude') updatePlot();
                    });
                }
            }
        });
        
        document.getElementById('btn-now').addEventListener('click', () => {
            const n = new Date();
            setDateControlsFromDate(n);
            document.getElementById('time').value = n.toTimeString().split(' ')[0];
            updatePlot();
        });

        document.getElementById('autoRotate').addEventListener('change', (e) => {
            if (e.target.checked) {
                startRotation();
            } else {
                stopRotation();
            }
        });
    }

    function startRotation() {
        if (autoRotateInterval) return;
        autoRotateInterval = setInterval(() => {
            cameraAngle += 0.005;
            const r = Math.sqrt(currentCameraEye.x**2 + currentCameraEye.y**2); // Maintain distance radius
            // Simple rotation around Z axis
            const newX = 2.0 * Math.cos(cameraAngle);
            const newY = 2.0 * Math.sin(cameraAngle);
            
            Plotly.relayout(plotDiv, {
                'scene.camera.eye': { x: newX, y: newY, z: currentCameraEye.z }
            });
        }, 20);
    }

    function stopRotation() {
        if (autoRotateInterval) {
            clearInterval(autoRotateInterval);
            autoRotateInterval = null;
        }
    }

    // Main Plot Function
    function updatePlot() {
        if (typeof Astronomy === 'undefined') {
            const msg = "Astronomy Engine library not loaded.";
            console.error(msg);
            document.getElementById('loading').innerHTML = `⚠️ ${msg}`;
            return;
        }

        try {
            const latInput = document.getElementById('lat');
            const lonInput = document.getElementById('lon');
            const latHemisphere = document.getElementById('latHemisphere');
            const lonHemisphere = document.getElementById('lonHemisphere');
            const altInput = document.getElementById('altitude');

            if (!latInput || !lonInput) return; // UI not ready

            let latVal = parseFloat(latInput.value);
            let lonVal = parseFloat(lonInput.value);
            let height = altInput ? parseFloat(altInput.value) : 0;
            if (isNaN(height)) height = 0;
            
            // Apply hemisphere sign
            const latSign = latHemisphere ? parseInt(latHemisphere.value) : 1;
            const lonSign = lonHemisphere ? parseInt(lonHemisphere.value) : 1;
            
            const lat = latVal * latSign;
            const lon = lonVal * lonSign;

            const dateStr = selectedDateString();
            const timeStr = document.getElementById('time').value;
            const showTrails = document.getElementById('showTrails').checked;
            const showGrid = document.getElementById('showGrid').checked;
            const showEquatorial = document.getElementById('showEquatorial').checked;

            if (!dateStr || !timeStr) {
                 console.warn("Date/Time input empty");
                 return;
            }
            const date = new Date(dateStr + 'T' + timeStr);
            if (isNaN(date.getTime())) {
                console.warn("Invalid Date:", dateStr, timeStr);
                return;
            }
        
            if (isNaN(lat) || isNaN(lon)) {
                console.warn("Invalid lat/lon:", lat, lon);
                return; // Skip update
            }

            let observer;
            try {
                // Explicitly pass non-zero height to avoid potential 0/NaN issues
                observer = new Astronomy.Observer(lat, lon, height);
            } catch(e) {
                console.error("Observer creation failed:", e, lat, lon);
                throw new Error("Observer creation failed: " + (e.message || e));
            }

            const frame = observerFrame(lat, lon);
            const traces = buildEarthTraces(frame, lat, lon);

        // 1. Horizon & Cardinal Points (Fixed Frame)
        if (showGrid) {
            // Horizon Fill (Gray, semi-transparent)
            // Use a Mesh3D to create the local tangent horizon plane.
            const meshX = [frame.observer.x], meshY = [frame.observer.y], meshZ = [frame.observer.z];
            const meshI = [], meshJ = [], meshK = [];
            const steps = 72;
            for (let i = 0; i < steps; i++) {
                const p = skyPointFromHorizontal(i * 360 / steps, 0, frame);
                meshX.push(p.x);
                meshY.push(p.y);
                meshZ.push(p.z);
                if (i > 0) {
                    meshI.push(0);
                    meshJ.push(i);
                    meshK.push(i + 1);
                }
            }
            // Close the loop
            meshI.push(0);
            meshJ.push(steps);
            meshK.push(1);

            traces.push({
                type: 'mesh3d',
                x: meshX, y: meshY, z: meshZ,
                i: meshI, j: meshJ, k: meshK,
                color: '#808080',
                opacity: 0.16,
                hoverinfo: 'none',
                name: '当地地平面'
            });

            // Horizon Circle (White Line)
            const horX=[], horY=[], horZ=[];
            for(let i=0; i<=360; i+=5) {
                const p = skyPointFromHorizontal(i, 0, frame);
                horX.push(p.x); horY.push(p.y); horZ.push(p.z);
            }
            traces.push({
                type: 'scatter3d', mode: 'lines',
                x: horX, y: horY, z: horZ,
                line: { color: '#ffffff', width: 4 },
                name: '地平圈', hoverinfo: 'none'
            });

            // Cardinal Lines (N-S, E-W)
            const northPoint = skyPointFromHorizontal(0, 0, frame);
            const southPoint = skyPointFromHorizontal(180, 0, frame);
            const eastPoint = skyPointFromHorizontal(90, 0, frame);
            const westPoint = skyPointFromHorizontal(270, 0, frame);
            traces.push({
                type: 'scatter3d', mode: 'lines',
                x: [southPoint.x, northPoint.x], y: [southPoint.y, northPoint.y], z: [southPoint.z, northPoint.z],
                line: { color: '#888', width: 2, dash: 'dash' },
                name: '南北线', hoverinfo: 'none'
            });
            traces.push({
                type: 'scatter3d', mode: 'lines',
                x: [westPoint.x, eastPoint.x], y: [westPoint.y, eastPoint.y], z: [westPoint.z, eastPoint.z],
                line: { color: '#888', width: 2, dash: 'dash' },
                name: '东西线', hoverinfo: 'none'
            });
            
            // Labels (N, S, E, W, Zenith, Nadir)
            const labels = [
                {t: '北', az: 0, alt: 0}, {t: '南', az: 180, alt: 0},
                {t: '东', az: 90, alt: 0}, {t: '西', az: 270, alt: 0},
                {t: '天顶', az: 0, alt: 90}, {t: '天底', az: 0, alt: -90}
            ];
            const lx=[], ly=[], lz=[], lt=[];
            labels.forEach(l => {
                const p = projectToSphere(skyPointFromHorizontal(l.az, l.alt, frame), CONFIG.sphereRadius * 1.04);
                lx.push(p.x); ly.push(p.y); lz.push(p.z);
                lt.push(l.t);
            });
            traces.push({
                type: 'scatter3d', mode: 'text',
                x: lx, y: ly, z: lz,
                text: lt,
                textfont: { color: '#fff', size: 12 },
                showlegend: false
            });
        }

        // 2. Celestial Sphere Wireframe (Equatorial Grid rotated to Horizon)
        // This visualizes how the "sky" (RA/Dec) is oriented relative to the observer.
        if (showEquatorial) {
            const gridColor = '#444';
            
            // Meridians (RA lines) - every 2h (30 deg)
            for(let ra=0; ra<24; ra+=2) {
                const raX=[], raY=[], raZ=[];
                for(let dec=-90; dec<=90; dec+=5) {
                    const hor = Astronomy.Horizon(date, observer, ra, dec, 'normal');
                    const p = skyPointFromHorizontal(hor.azimuth, hor.altitude, frame);
                    raX.push(p.x); raY.push(p.y); raZ.push(p.z);
                }
                traces.push({
                    type: 'scatter3d', mode: 'lines',
                    x: raX, y: raY, z: raZ,
                    line: { color: gridColor, width: 1 },
                    showlegend: false, hoverinfo: 'none'
                });
            }
            
            // Parallels (Dec lines) - every 30 deg
            for(let dec=-60; dec<=60; dec+=30) {
                const decX=[], decY=[], decZ=[];
                for(let ra=0; ra<=24; ra+=0.5) { // 0 to 24h
                    const hor = Astronomy.Horizon(date, observer, ra, dec, 'normal');
                    const p = skyPointFromHorizontal(hor.azimuth, hor.altitude, frame);
                    decX.push(p.x); decY.push(p.y); decZ.push(p.z);
                }
                traces.push({
                    type: 'scatter3d', mode: 'lines',
                    x: decX, y: decY, z: decZ,
                    line: { color: gridColor, width: 1 },
                    showlegend: false, hoverinfo: 'none'
                });
            }

            // Celestial Poles (NCP, SCP)
            // NCP is at Dec=90. SCP is at Dec=-90.
            const ncpHor = Astronomy.Horizon(date, observer, 0, 90, 'normal');
            const scpHor = Astronomy.Horizon(date, observer, 0, -90, 'normal');
            const ncp = projectToSphere(skyPointFromHorizontal(ncpHor.azimuth, ncpHor.altitude, frame), CONFIG.sphereRadius * 1.04);
            const scp = projectToSphere(skyPointFromHorizontal(scpHor.azimuth, scpHor.altitude, frame), CONFIG.sphereRadius * 1.04);
            
            traces.push({
                type: 'scatter3d', mode: 'text',
                x: [ncp.x], y: [ncp.y], z: [ncp.z],
                text: ['北天极'],
                textfont: { color: 'red', size: 12 },
                showlegend: false
            });
            
            // Celestial Axis Line
            traces.push({
                type: 'scatter3d', mode: 'lines',
                x: [scp.x, ncp.x], y: [scp.y, ncp.y], z: [scp.z, ncp.z],
                line: { color: 'red', width: 2, dash: 'dot' },
                name: '地轴', hoverinfo: 'none'
            });
        }

        // 3. Planets & Trails
        CONFIG.bodies.forEach(body => {
            // Current Position
            const equ = Astronomy.Equator(body.name, date, observer, false, true);
            const hor = Astronomy.Horizon(date, observer, equ.ra, equ.dec, 'normal');
            const pos = skyPointFromHorizontal(hor.azimuth, hor.altitude, frame);
            
            // Marker
            traces.push({
                type: 'scatter3d', mode: 'markers+text',
                x: [pos.x], y: [pos.y], z: [pos.z],
                marker: { size: body.size, color: body.color },
                text: [body.label],
                textposition: 'top center',
                textfont: { color: 'white' },
                name: body.label,
                hoverinfo: 'text',
                hovertext: `${body.label}<br>方位: ${hor.azimuth.toFixed(1)}°<br>高度: ${hor.altitude.toFixed(1)}°`
            });

            // Trail (Daily Motion)
            if (showTrails) {
                // Split trails into "Above Horizon" (Solid) and "Below Horizon" (Dash)
                const trailAbove = { x:[], y:[], z:[] };
                const trailBelow = { x:[], y:[], z:[] };
                
                const start = new Date(date.getTime());
                start.setHours(0,0,0,0); // Start from midnight
                
                // Helper to add point to arrays
                const addP = (arr, p) => { arr.x.push(p.x); arr.y.push(p.y); arr.z.push(p.z); };
                const addNull = (arr) => { arr.x.push(null); arr.y.push(null); arr.z.push(null); };
                
                // We'll calculate positions finely
                const steps = 144; // Every 10 mins
                let prevP = null;
                let prevAlt = null;

                for(let i=0; i<=steps; i++) {
                    const t = new Date(start.getTime() + i * (24*60*60*1000)/steps);
                    const t_equ = Astronomy.Equator(body.name, t, observer, false, true);
                    const t_hor = Astronomy.Horizon(t, observer, t_equ.ra, t_equ.dec, 'normal');
                    const p = skyPointFromHorizontal(t_hor.azimuth, t_hor.altitude, frame);
                    const alt = t_hor.altitude;

                    if (prevP !== null) {
                        // Check for crossing
                        if ((prevAlt >= 0 && alt < 0) || (prevAlt < 0 && alt >= 0)) {
                            // Calculate approximate crossing point (linear interpolation where alt=0)
                            // ratio = (0 - prevAlt) / (alt - prevAlt)
                            const ratio = -prevAlt / (alt - prevAlt);
                            const crossP = {
                                x: prevP.x + (p.x - prevP.x) * ratio,
                                y: prevP.y + (p.y - prevP.y) * ratio,
                                z: prevP.z + (p.z - prevP.z) * ratio
                            };
                            const projectedCrossP = projectToSphere(crossP);
                            
                            // Add crossing point to BOTH segments to close gap
                            if (prevAlt >= 0) { // Going down
                                addP(trailAbove, projectedCrossP); addNull(trailAbove);
                                addNull(trailBelow); addP(trailBelow, projectedCrossP);
                            } else { // Going up
                                addP(trailBelow, projectedCrossP); addNull(trailBelow);
                                addNull(trailAbove); addP(trailAbove, projectedCrossP);
                            }
                        }
                    }

                    if (alt >= 0) {
                        addP(trailAbove, p);
                    } else {
                        addP(trailBelow, p);
                    }
                    
                    prevP = p;
                    prevAlt = alt;
                }
                
                // Add Above Trace (Solid/Custom)
                traces.push({
                    type: 'scatter3d', mode: 'lines',
                    x: trailAbove.x, y: trailAbove.y, z: trailAbove.z,
                    line: { color: body.color, width: body.width || 3, dash: body.dash || 'solid' },
                    connectgaps: false,
                    showlegend: false,
                    hoverinfo: 'none'
                });

                // Add Below Trace (Dash/Faint)
                // For below horizon, we use the same style but with reduced opacity to indicate "hidden"
                traces.push({
                    type: 'scatter3d', mode: 'lines',
                    x: trailBelow.x, y: trailBelow.y, z: trailBelow.z,
                    line: { color: body.color, width: body.width || 3, dash: body.dash || 'solid' }, 
                    opacity: 0.3,
                    connectgaps: false,
                    showlegend: false,
                    hoverinfo: 'none'
                });

                // 24 Hour Markers (Integer Hours)
                const hourX=[], hourY=[], hourZ=[], hourText=[];
                for(let h=0; h<24; h++){
                    const t = new Date(start.getTime());
                    t.setHours(h, 0, 0, 0);
                    const t_equ = Astronomy.Equator(body.name, t, observer, false, true);
                    const t_hor = Astronomy.Horizon(t, observer, t_equ.ra, t_equ.dec, 'normal');
                    // Only if above horizon? User said "整24小时点", maybe all? Let's show all.
                    const p = skyPointFromHorizontal(t_hor.azimuth, t_hor.altitude, frame);
                    hourX.push(p.x); hourY.push(p.y); hourZ.push(p.z);
                    hourText.push(`${h}h`);
                }
                traces.push({
                    type: 'scatter3d', mode: 'markers+text',
                    x: hourX, y: hourY, z: hourZ,
                    marker: { size: 2, color: body.color },
                    text: hourText,
                    textfont: { color: body.color, size: 10 },
                    textposition: 'top right',
                    showlegend: false,
                    hoverinfo: 'text'
                });

                // Rise/Set Points
                try {
                    if (typeof Astronomy.SearchRiseSet === 'function') {
                        const rise = Astronomy.SearchRiseSet(body.name, date, observer, +1);
                        const set = Astronomy.SearchRiseSet(body.name, date, observer, -1);
                        
                        [
                            { evt: rise, label: '日升' }, 
                            { evt: set, label: '日落' }
                        ].forEach(item => {
                            if (item.evt && item.evt.date) {
                                // Calculate position at rise/set time
                                // By definition Altitude is 0 (approx, depending on refraction)
                                // We use the exact time to get Azimuth
                                const t_evt = item.evt.date;
                                const t_equ = Astronomy.Equator(body.name, t_evt, observer, false, true);
                                const t_hor = Astronomy.Horizon(t_evt, observer, t_equ.ra, t_equ.dec, 'normal');
                                const p = skyPointFromHorizontal(t_hor.azimuth, 0, frame); // Force Alt=0 for visual cleaniness on horizon
                                
                                traces.push({
                                    type: 'scatter3d', mode: 'markers+text',
                                    x: [p.x], y: [p.y], z: [p.z],
                                    marker: { size: 5, color: body.color, symbol: 'diamond' },
                                    text: [item.label], // "日升" / "日落" - maybe customize based on body name?
                                    textfont: { color: 'white', size: 12 },
                                    showlegend: false,
                                    hoverinfo: 'text',
                                    hovertext: `${body.label} ${item.label}: ${t_evt.toLocaleTimeString()}`
                                });
                            }
                        });
                    } else {
                        console.warn("Astronomy.SearchRiseSet not found");
                    }
                } catch(e) {
                    console.warn(`Failed to calc rise/set for ${body.name}:`, e);
                }
            }
        });

        // Layout
        const layout = {
            scene: {
                xaxis: { title: '', range: [-1.42, 1.42], showgrid: false, zeroline: false, showticklabels: false, visible: false },
                yaxis: { title: '', range: [-1.42, 1.42], showgrid: false, zeroline: false, showticklabels: false, visible: false },
                zaxis: { title: '', range: [-1.42, 1.42], showgrid: false, zeroline: false, showticklabels: false, visible: false },
                aspectmode: 'cube',
                dragmode: 'orbit', // Enable rotation!
                bgcolor: 'black',
                camera: {
                    eye: currentCameraEye // Preserve camera pos if set
                }
            },
            paper_bgcolor: 'black',
            plot_bgcolor: 'black',
            margin: { l: 0, r: 0, t: 30, b: 0 },
            showlegend: true,
            legend: { x: 0, y: 1, font: { color: 'white' } },
            title: {
                text: `地心天球 (${dateStr} ${timeStr})<br><span style="font-size:12px">${Math.abs(lat).toFixed(2)}°${lat>=0?'N':'S'}, ${Math.abs(lon).toFixed(2)}°${lon>=0?'E':'W'}, Alt: ${height}m</span>`,
                font: { color: 'white', size: 16 },
                y: 0.98
            }
        };

        Plotly.react('plot-container', traces, layout).then(gd => {
            document.getElementById('loading').style.display = 'none';
            // Capture camera updates to preserve view during refresh
            gd.on('plotly_relayout', (eventData) => {
                if (eventData['scene.camera.eye']) {
                    currentCameraEye = eventData['scene.camera.eye'];
                }
            });
        }).catch(err => {
             console.error("Plotly.react failed:", err);
             document.getElementById('loading').style.display = 'block';
             document.getElementById('loading').innerHTML = `Plotly 渲染失败: ${err.message || err}`;
        });
        } catch (err) {
            console.error("UpdatePlot Error:", err);
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';
            loadingEl.style.color = 'red';
            const msg = err.message || JSON.stringify(err) || "Unknown Error";
            loadingEl.innerHTML = `绘图出错: ${msg}<br><small>See console for details</small>`;
        }
    }

    // Start
    initUI();
    updatePlot();

</script>
</body>
</html>
