<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR 三栏对照</title>
  <link rel="stylesheet" href="./ocr-compare.css">
</head>
<body>
  <div class="ocr-shell">
    <header class="ocr-header">
      <a class="back-link" href="./index.html" aria-label="返回智能体首页">←</a>
      <div>
        <p>OCR Preview Lab</p>
        <h1>OCR 三栏对照</h1>
      </div>
      <span id="statusBadge" class="status-badge">Ready</span>
    </header>

    <section class="control-band">
      <input id="pdfInput" class="hidden-input" type="file" accept=".pdf,application/pdf,image/*">
      <input id="mineruInput" class="hidden-input" type="file" accept=".json,application/json">
      <input id="contentListInput" class="hidden-input" type="file" accept=".json,application/json">
      <div class="control-column control-column-pdf" aria-label="原文 PDF">
        <button id="pickPdfButton" class="primary-button upload-button" type="button">
          <span class="upload-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 3v12"></path>
              <path d="m7 8 5-5 5 5"></path>
              <path d="M5 15v4h14v-4"></path>
            </svg>
          </span>
          <span>上传 PDF</span>
        </button>
      </div>
      <div class="control-column control-column-mineru" aria-label="MinerU 文件">
        <button id="pickMineruButton" class="secondary-button upload-button" type="button">
          <span class="upload-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 3v12"></path>
              <path d="m7 8 5-5 5 5"></path>
              <path d="M5 15v4h14v-4"></path>
            </svg>
          </span>
          <span>上传 MinerU JSON</span>
        </button>
        <button id="pickContentListButton" class="secondary-button upload-button" type="button">
          <span class="upload-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 3v12"></path>
              <path d="m7 8 5-5 5 5"></path>
              <path d="M5 15v4h14v-4"></path>
            </svg>
          </span>
          <span>上传 content_list</span>
        </button>
      </div>
      <div class="control-column control-column-review" aria-label="校对操作和页码">
        <div class="workflow-actions" aria-label="校对操作">
          <button id="nextRiskButton" class="secondary-button utility-hidden" type="button" disabled hidden>下一高风险页</button>
          <button id="mathpixButton" class="primary-button utility-hidden" type="button" disabled hidden>整页 Mathpix（备用）</button>
          <button id="exportOriginalButton" class="secondary-button" type="button" disabled>导出原始 MinerU</button>
          <button id="exportCorrectedButton" class="secondary-button" type="button" disabled>导出校正稿</button>
          <button id="clearButton" class="secondary-button" type="button">清空</button>
        </div>
        <div class="file-summary">
          <strong id="fileName">未选择原书 PDF</strong>
          <span id="fileMeta">中栏读取已有 MinerU 整书识别结果；优先点击高风险块进行 Mathpix 块级校正。</span>
        </div>
        <div class="pager">
          <span class="control-label">页码</span>
          <button id="firstPageButton" class="secondary-button pager-icon" type="button" disabled aria-label="跳转到首页" title="首页">⏮</button>
          <button id="prevPageButton" class="secondary-button pager-icon" type="button" disabled aria-label="上一页" title="上一页">‹</button>
          <label class="page-field">
            <span class="sr-only">页码</span>
            <input id="pageInput" type="number" min="1" value="1" disabled aria-label="页码">
          </label>
          <span id="pageCountLabel">/ -</span>
          <button id="nextPageButton" class="secondary-button pager-icon" type="button" disabled aria-label="下一页" title="下一页">›</button>
          <button id="lastPageButton" class="secondary-button pager-icon" type="button" disabled aria-label="跳转到尾页" title="尾页">⏭</button>
        </div>
      </div>
    </section>

    <main class="preview-panel">
      <div class="column-heads">
        <div>每页 OCR 截图</div>
        <button class="column-resizer" type="button" data-resizer="left" aria-label="调整原文和 MinerU 栏宽"></button>
        <div>MinerU Markdown 预览</div>
        <button class="column-resizer" type="button" data-resizer="right" aria-label="调整 MinerU 和校对栏宽"></button>
        <div>高风险校对</div>
      </div>
      <section id="pageList" class="page-list">
        <div class="empty-state">选择原书 PDF，再选择对应的 MinerU `_middle.json`。优先点击高风险块，只对该块调用 Mathpix。</div>
      </section>
    </main>
  </div>

  <script src="./runtime-config.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      },
      startup: {
        typeset: false,
        pageReady: () =>
          MathJax.startup.defaultPageReady().then(() => {
            window.dispatchEvent(new Event("mathjax-ready"));
          })
      }
    };
  </script>
  <script src="./ocr-compare.js"></script>
</body>
</html>
